openapi: 3.1.0
info:
  title: Trader engine API
  version: 2.0.0
  description: |
    The way into the engine for the app and the notifier. The app manages
    accounts; the engine keeps each account's agent wallet in its vault,
    places its trades on Hyperliquid and runs the radar.

    Every request except /v1/health and /v1/openapi.yaml needs
    `Authorization: Bearer <ENGINE_API_TOKEN>`.

    Creates take an optional client-chosen `id` (a UUID). Retrying with the
    same id returns what the first request created, with status 200 instead
    of 201, so a request that timed out can safely be sent again.
security:
  - token: []
paths:
  /v1/health:
    get:
      summary: Whether the engine can work, for an uptime monitor
      description: 200 when the database answers, 503 when it does not.
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/openapi.yaml:
    get:
      summary: This document
      security: []
      responses:
        "200":
          description: The OpenAPI document
          content:
            application/yaml: {}
  /v1/tenants:
    post:
      summary: Create a tenant
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewTenant"}
      responses:
        "201": {$ref: "#/components/responses/Tenant"}
        "200": {$ref: "#/components/responses/Tenant"}
        "400": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
  /v1/tenants/{tenant}:
    parameters:
      - $ref: "#/components/parameters/tenant"
    get:
      summary: Get a tenant
      responses:
        "200": {$ref: "#/components/responses/Tenant"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      summary: Close a tenant for good
      description: Its wallet key is revoked and erased, and the tenant keeps its id but not its name. A closed tenant gets no new wallet and places no trades. Closing twice changes nothing more.
      responses:
        "200": {$ref: "#/components/responses/Tenant"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/tenants/{tenant}/wallet:
    parameters:
      - $ref: "#/components/parameters/tenant"
    post:
      summary: Make the account's agent wallet on Hyperliquid
      description: The engine makes an agent wallet and keeps its key sealed; the account's own wallet approves it with the approvals below. An account has one wallet; a second request returns it.
      responses:
        "201":
          description: The wallet, made now
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Wallet"}
        "200":
          description: The wallet the account already had
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Wallet"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
    get:
      summary: The wallet and, once approved, the account
      responses:
        "200":
          description: The wallet; account is present once the agent is approved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Wallet"}
        "404": {$ref: "#/components/responses/Error"}
  /v1/tenants/{tenant}/wallet/approvals:
    parameters:
      - $ref: "#/components/parameters/tenant"
    get:
      summary: What the account's wallet signs to approve the agent and the builder fee
      description: Returns typed data for eth_signTypedData_v4. The wallet is made first if the account has none.
      parameters:
        - name: user
          in: query
          required: true
          schema: {type: string, description: The account's address.}
        - name: mode
          in: query
          required: true
          schema: {type: string, enum: [testnet, mainnet]}
      responses:
        "200":
          description: The approvals to sign
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WalletApprovals"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      summary: Submit the signed approvals
      description: The engine relays only the actions it gave, confirms with the exchange that the agent acts for the account and that the builder fee is approved, then records the account.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WalletApproval"}
      responses:
        "200":
          description: The approved wallet
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Wallet"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/tenants/{tenant}/trades:
    parameters:
      - $ref: "#/components/parameters/tenant"
    post:
      summary: Open a position with its stops in one batch
      description: A market order within the slippage of the mid price, with a stop-loss and, when given, a take-profit as reduce-only trigger orders on the exchange, so the position is protected even if the engine stops. The builder fee rides on the order when the account approved it. Refused beyond the engine's limits, without an approved wallet, or when nothing filled.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NewTrade"}
      responses:
        "200":
          description: The position opened
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Trade"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/tenants/{tenant}/trades/close:
    parameters:
      - $ref: "#/components/parameters/tenant"
    post:
      summary: Close a position and cancel its stops
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CloseTrade"}
      responses:
        "200":
          description: What closed; remaining is what did not fill, still guarded by its stops
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClosedTrade"}
        "400": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
  /v1/radar/alerts:
    get:
      summary: The radar's latest alerts
      description: Unusual moves on every Hyperliquid perpetual, oldest first. Without `after`, the last `limit` alerts; with it, those numbered above that seq. The engine keeps the last thousand in memory.
      parameters:
        - $ref: "#/components/parameters/after"
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 50}
      responses:
        "200":
          description: The alerts
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RadarAlertList"}
        "400": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /v1/radar/stream:
    get:
      summary: The radar's alerts as they are raised
      description: |
        Server-sent events. Each message has `id` (the seq), `event`
        (`radar.alert`) and `data` (the RadarAlert as JSON). A comment line
        arrives every 15 seconds when nothing else does. To resume,
        reconnect with Last-Event-ID or `after`.
      parameters:
        - $ref: "#/components/parameters/after"
        - name: Last-Event-ID
          in: header
          schema: {type: integer, minimum: 0}
      responses:
        "200":
          description: The stream
          content:
            text/event-stream: {}
        "400": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      description: ENGINE_API_TOKEN opens every route. ENGINE_NOTIFIER_TOKEN, the notifier's, opens only the radar and a tenant's trades; elsewhere it gets 403 forbidden.
  parameters:
    tenant:
      name: tenant
      in: path
      required: true
      schema: {type: string, format: uuid}
    after:
      name: after
      in: query
      description: Only alerts with a higher seq.
      schema: {type: integer, minimum: 0, default: 0}
  responses:
    Error:
      description: The request failed
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: {$ref: "#/components/schemas/Error"}
    Tenant:
      description: The tenant
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Tenant"}
  schemas:
    NewTrade:
      type: object
      required: [coin, side, usd, leverage, stop_loss_pct]
      properties:
        coin: {type: string, example: ETH}
        side: {type: string, enum: [long, short]}
        usd: {type: number, description: The position's size in dollars, within the engine's limit.}
        leverage: {type: integer, minimum: 1}
        stop_loss_pct: {type: number, description: Stop-loss as a fraction of the entry price; 0.1 is 10%.}
        take_profit_pct: {type: number, description: Take-profit as a fraction of the entry price; none when absent.}
        slippage_pct: {type: number, description: How far from the mid price the order may fill; 0.01 by default.}
    Trade:
      type: object
      required: [coin, side, size, entry_px, usd, leverage, oid, stop_px, stop_oid]
      properties:
        coin: {type: string}
        side: {type: string, enum: [long, short]}
        size: {type: number, description: In the coin.}
        entry_px: {type: number}
        usd: {type: number}
        leverage: {type: integer}
        oid: {type: integer, description: The market order's exchange ID.}
        stop_px: {type: number}
        stop_oid: {type: integer}
        take_profit_px: {type: number}
        take_profit_oid: {type: integer}
    CloseTrade:
      type: object
      required: [coin]
      properties:
        coin: {type: string}
        slippage_pct: {type: number}
    ClosedTrade:
      type: object
      required: [coin, size, avg_px, remaining, stops_cancelled]
      properties:
        coin: {type: string}
        size: {type: number}
        avg_px: {type: number}
        remaining: {type: number}
        stops_cancelled: {type: integer}
    Wallet:
      type: object
      required: [id, agent_address, agent_approved, builder_fee]
      properties:
        id: {type: string, format: uuid}
        agent_address: {type: string, description: The agent wallet the engine holds.}
        user: {type: string, description: The account it trades for, once approved.}
        mode: {type: string, enum: [testnet, mainnet]}
        agent_approved: {type: boolean}
        builder_fee: {type: integer, description: The builder fee the account approved, in tenths of a basis point.}
        account: {$ref: "#/components/schemas/WalletAccount"}
    WalletAccount:
      type: object
      required: [value, withdrawable, positions]
      properties:
        value: {type: number, description: Equity in USDC.}
        withdrawable: {type: number}
        positions:
          type: array
          items: {$ref: "#/components/schemas/PerpPosition"}
    PerpPosition:
      type: object
      required: [coin, size, entry_px, value, unrealized_pnl, liquidation_px, leverage, cross]
      properties:
        coin: {type: string}
        size: {type: number, description: Negative when short.}
        entry_px: {type: number}
        value: {type: number}
        unrealized_pnl: {type: number}
        liquidation_px: {type: number}
        leverage: {type: integer}
        cross: {type: boolean}
    WalletApprovals:
      type: object
      required: [user, mode, agent_address, approve_agent]
      properties:
        user: {type: string}
        mode: {type: string, enum: [testnet, mainnet]}
        agent_address: {type: string}
        approve_agent: {type: object, description: "{action, nonce, typed_data}: sign typed_data, send action, nonce and the signature back."}
        approve_builder_fee: {type: object, description: The same for the builder fee; absent when the engine charges none.}
    Signature:
      type: object
      required: [r, s, v]
      properties:
        r: {type: string}
        s: {type: string}
        v: {type: integer}
    SignedAction:
      type: object
      required: [action, nonce, signature]
      properties:
        action: {type: object, description: The action exactly as the engine gave it.}
        nonce: {type: integer}
        signature: {$ref: "#/components/schemas/Signature"}
    WalletApproval:
      type: object
      required: [user, mode, approve_agent]
      properties:
        user: {type: string}
        mode: {type: string, enum: [testnet, mainnet]}
        approve_agent: {$ref: "#/components/schemas/SignedAction"}
        approve_builder_fee: {$ref: "#/components/schemas/SignedAction"}
    RadarAlert:
      type: object
      description: One unusual move the radar raised. Changes are fractions; 0.05 is +5%.
      required: [seq, at, coin, price, change_15m, change_1h, change_24h, sigma_15m, volume_rate, volume_24h_usd, oi_change_1h, funding, score, reasons, text, history]
      properties:
        seq: {type: integer}
        at: {type: string, format: date-time}
        coin: {type: string, example: HYPE}
        rule: {type: string, description: "The trigger: pump-and-crash, unpumped crash, crowded rise, spike rejected, big move, big hour, open interest swing, funding flip."}
        price: {type: number}
        change_15m: {type: number}
        change_1h: {type: number}
        change_24h: {type: number}
        sigma_15m: {type: number, description: The 15-minute move in units of the coin's own 15-minute volatility.}
        volume_rate: {type: number, description: The last 15 minutes' volume against the day's 15-minute average.}
        volume_24h_usd: {type: number}
        oi_change_1h: {type: number}
        funding: {type: number, description: The hourly funding rate.}
        score: {type: number, description: Strength, for ordering.}
        reasons:
          type: array
          items: {type: string}
        text: {type: string, description: The alert as a chat shows it, history included.}
        history: {type: string, description: What followed moves like this on Binance perpetuals since 2020; empty when the move is under 3% in 15 minutes.}
        suggestion: {$ref: "#/components/schemas/TradeSuggestion"}
        momentum: {$ref: "#/components/schemas/Momentum"}
    TradeSuggestion:
      type: object
      description: The trade the history argues for on an alert, with the stop it needs; absent when the record says stay out.
      required: [side, stop_loss_pct, reason]
      properties:
        side: {type: string, enum: [long, short]}
        stop_loss_pct: {type: number}
        reason: {type: string}
    Momentum:
      type: object
      description: The read of a five-green-candle run; present on momentum-run alerts only.
      required: [run, score, class, inflow, volume_rate, volume_rising, book_bids, oi_change, funding, btc_1h, btc_4h, btc, resistance, support, extended, rsi, move, sustainability, pullback_risk, fresh_money, verdict]
      properties:
        run: {type: number, description: The five candles' rise, as a fraction.}
        score: {type: integer, minimum: 0, maximum: 100}
        class: {type: string, enum: [STRONG LONG, WATCHLIST]}
        inflow: {type: string, enum: [strong, moderate, weak]}
        volume_rate: {type: number}
        volume_rising: {type: boolean}
        book_bids: {type: number, description: Share of the top of the book on the bid side; 0 when unknown.}
        oi_change: {type: number}
        funding: {type: number}
        btc_1h: {type: number}
        btc_4h: {type: number}
        btc: {type: string, enum: [bullish, neutral, bearish]}
        resistance: {type: number}
        support: {type: number}
        extended: {type: number, description: Above the day's average price, as a fraction.}
        rsi: {type: number}
        move: {type: string}
        sustainability: {type: string}
        pullback_risk: {type: string}
        fresh_money: {type: string}
        verdict: {type: string}
    RadarAlertList:
      type: object
      required: [alerts]
      properties:
        alerts:
          type: array
          items: {$ref: "#/components/schemas/RadarAlert"}
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [bad_request, unauthorized, forbidden, not_found, conflict, refused, radar_off, internal]
        message:
          type: string
          description: Safe to show to the user for refused.
    Health:
      type: object
      required: [ok]
      properties:
        ok: {type: boolean}
        commit: {type: string, description: The source commit the engine was built from, when known.}
    NewTenant:
      type: object
      required: [name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    Tenant:
      type: object
      required: [id, name, status]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        status: {type: string, enum: [active, suspended, closed]}
